name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "deno.lock"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: true

# Required GitHub Actions secrets for migrations and Notion deployment:
# SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD,
# NOTION_CLIENT_ID, NOTION_CLIENT_SECRET, NOTION_TOKEN_ENCRYPTION_KEY,
# GOOGLE_CALENDAR_CLIENT_SECRET. Public TAURI_GOOGLE_CALENDAR_CLIENT_ID is a
# repository variable shared with the Windows release build.
# Optional repository variable: NOTION_REDIRECT_URI. When omitted, the workflow
# derives the canonical callback URL from SUPABASE_PROJECT_REF.

# GitHub repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN     — Personal access token with Supabase deploy scope
#   SUPABASE_PROJECT_REF      — e.g. dzpyrdxelcgfpmcdojvb
#
# AI Coach (coach-chat) — Azure OpenAI (NOT baked into the Tauri app):
#   AZURE_OPENAI_API_KEY
#   AZURE_OPENAI_ENDPOINT     — optional, defaults in function code
#   AZURE_OPENAI_DEPLOYMENT   — optional, defaults to Mistral-Large-3
#
# Individual PM reports (generate-insights):
#   OPENROUTER_API_KEY
#   OPENROUTER_MODEL          — optional

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Test Edge Functions
        # These tests use Deno's Node built-ins, but the deploy runner does not
        # install the root package.json dependencies before running them.
        run: deno test --node-modules-dir=none --allow-env --allow-read supabase/functions

      - name: Validate required deployment secrets
        id: deployment_config
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          NOTION_TOKEN_ENCRYPTION_KEY: ${{ secrets.NOTION_TOKEN_ENCRYPTION_KEY }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          TAURI_GOOGLE_CALENDAR_CLIENT_ID: ${{ vars.TAURI_GOOGLE_CALENDAR_CLIENT_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_PROJECT_REF \
            SUPABASE_DB_PASSWORD \
            NOTION_CLIENT_ID \
            NOTION_CLIENT_SECRET \
            NOTION_TOKEN_ENCRYPTION_KEY \
            GOOGLE_CALENDAR_CLIENT_SECRET \
            TAURI_GOOGLE_CALENDAR_CLIENT_ID; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::warning::Supabase deployment skipped; missing configuration: %s\n' "${missing[*]}"
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
            printf '### Supabase deployment not run\nMissing configuration: `%s`. Edge Function tests passed, but no functions or migrations were deployed.\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              exit 1
            fi
          else
            printf 'ready=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Link Supabase project
        if: steps.deployment_config.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Set Edge Function secrets
        if: steps.deployment_config.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          NOTION_REDIRECT_URI: ${{ vars.NOTION_REDIRECT_URI }}
          NOTION_TOKEN_ENCRYPTION_KEY: ${{ secrets.NOTION_TOKEN_ENCRYPTION_KEY }}
          GOOGLE_CALENDAR_CLIENT_ID: ${{ vars.TAURI_GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          SECRETS=()
          [ -n "${AZURE_OPENAI_API_KEY:-}" ] && SECRETS+=("AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}")
          [ -n "${AZURE_OPENAI_ENDPOINT:-}" ] && SECRETS+=("AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}")
          [ -n "${AZURE_OPENAI_DEPLOYMENT:-}" ] && SECRETS+=("AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}")
          [ -n "${OPENROUTER_API_KEY:-}" ] && SECRETS+=("OPENROUTER_API_KEY=${OPENROUTER_API_KEY}")
          [ -n "${OPENROUTER_MODEL:-}" ] && SECRETS+=("OPENROUTER_MODEL=${OPENROUTER_MODEL}")
          SECRETS+=("NOTION_CLIENT_ID=${NOTION_CLIENT_ID}")
          SECRETS+=("NOTION_CLIENT_SECRET=${NOTION_CLIENT_SECRET}")
          SECRETS+=("NOTION_REDIRECT_URI=${NOTION_REDIRECT_URI:-https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/notion-oauth}")
          SECRETS+=("NOTION_TOKEN_ENCRYPTION_KEY=${NOTION_TOKEN_ENCRYPTION_KEY}")
          SECRETS+=("GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID}")
          SECRETS+=("GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET}")
          supabase secrets set "${SECRETS[@]}"

      - name: Apply database migrations
        if: steps.deployment_config.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        if: steps.deployment_config.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for function_name in \
            coach-chat \
            generate-insights \
            notion-oauth \
            notion-destinations \
            publish-notion-report \
            calendar-token \
            privacy-rights; do
            supabase functions deploy "$function_name"
          done
