name: Release — FlowSight Agent

on:
  release:
    types: [published]
  # Re-attach installers without republishing. Use artifact_run_id to skip the
  # ~30min Windows rebuild when the bundle already exists from a prior run.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach Windows installers to (e.g. v3.6.1)"
        required: true
        type: string
      artifact_run_id:
        description: "Optional Actions run ID that already has the windows-bundle artifact"
        required: false
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

# Secrets requeridos en el repo: Settings → Secrets and variables → Actions
#   TAURI_JIRA_CLIENT_ID, TAURI_JIRA_CLIENT_SECRET
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
# (Opcional: TAURI_LINEAR_CLIENT_ID, TAURI_LINEAR_CLIENT_SECRET si usáis Linear.)
# No commitees .env.local; el CI inyecta estos valores en `pnpm build`.

# Note: Linux builds live in a separate repo (Mancasvel/FlowSight_linux).
# Cliente iOS: repositorio dedicado FlowSight-iOS (fuera de este monorepo).
# Este workflow solo produce instaladores Windows.

jobs:
  build-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == '' }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAURI_JIRA_CLIENT_ID: ${{ secrets.TAURI_JIRA_CLIENT_ID }}
      TAURI_JIRA_CLIENT_SECRET: ${{ secrets.TAURI_JIRA_CLIENT_SECRET }}
      TAURI_LINEAR_CLIENT_ID: ${{ secrets.TAURI_LINEAR_CLIENT_ID }}
      TAURI_LINEAR_CLIENT_SECRET: ${{ secrets.TAURI_LINEAR_CLIENT_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Required for signed auto-update artifacts (tauri-plugin-updater).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - name: Reject outdated tauri 2.9.x (stale release tag)
        shell: bash
        run: |
          set -euo pipefail
          f=apps/agent/src-tauri/Cargo.toml
          if grep -qE 'tauri = \{ version = "2\.9' "$f"; then
            echo "::error title=Stale release tag::Create a **new tag** on the latest \`main\` and publish a **new** GitHub Release."
            grep -E 'tauri' "$f" || true
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/agent/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      # Generate the updater manifest the app polls at
      # releases/latest/download/latest.json. We point it at the NSIS installer
      # because it self-updates per-user without a UAC prompt. GitHub renames
      # release assets by replacing spaces with dots, so the download URL must too.
      - name: Generate latest.json (updater manifest)
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_BODY: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NSIS_DIR="apps/agent/src-tauri/target/release/bundle/nsis"
          EXE="$(ls "$NSIS_DIR"/*-setup.exe | head -n1)"
          SIG="$(ls "$NSIS_DIR"/*-setup.exe.sig | head -n1)"
          BASENAME="$(basename "$EXE")"
          # GitHub stores release assets with spaces replaced by dots.
          export ASSET_NAME="$(echo "$BASENAME" | tr ' ' '.')"
          export APP_VERSION="$(echo "$BASENAME" | sed -E 's/.*_([0-9]+\.[0-9]+\.[0-9]+)_.*/\1/')"
          export DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
          export SIGNATURE="$(cat "$SIG")"
          export PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node -e '
            const fs = require("fs");
            const manifest = {
              version: process.env.APP_VERSION,
              notes: process.env.RELEASE_BODY || "",
              pub_date: process.env.PUB_DATE,
              platforms: {
                "windows-x86_64": {
                  signature: process.env.SIGNATURE,
                  url: process.env.DOWNLOAD_URL
                }
              }
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
            console.log(manifest);
          '

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            apps/agent/src-tauri/target/release/bundle/nsis/*.exe
            apps/agent/src-tauri/target/release/bundle/msi/*.msi
            latest.json
          if-no-files-found: error
          retention-days: 14

      # Upload from the Windows runner so we do not round-trip ~3GB through
      # artifacts just to attach. gh CLI handles >1GB files better than
      # softprops/action-gh-release, and retries cover GitHub upload 5xx.
      - name: Attach installers to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          upload_one() {
            local file="$1"
            local required="${2:-1}"
            local n=1
            local max=8
            while true; do
              echo "Uploading $(basename "$file") (attempt ${n}/${max}, $(du -h "$file" | cut -f1))"
              if gh release upload "$TAG" "$file" --clobber; then
                echo "OK $(basename "$file")"
                return 0
              fi
              if [ "$n" -ge "$max" ]; then
                if [ "$required" = "1" ]; then
                  echo "::error::Failed to upload $file after ${max} attempts"
                  return 1
                fi
                echo "::warning::Optional asset failed: $file"
                return 0
              fi
              n=$((n + 1))
              sleep $((n * 15))
            done
          }
          shopt -s nullglob
          nsis=(apps/agent/src-tauri/target/release/bundle/nsis/*-setup.exe)
          msi=(apps/agent/src-tauri/target/release/bundle/msi/*.msi)
          if [ ${#nsis[@]} -eq 0 ]; then
            echo "::error::No NSIS *-setup.exe found"
            exit 1
          fi
          for f in "${nsis[@]}"; do upload_one "$f" 1; done
          upload_one latest.json 1
          for f in "${msi[@]}"; do upload_one "$f" 0; done

  attach-from-artifact:
    # Retry path: reuse a successful windows-bundle instead of rebuilding.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download windows-bundle from prior run
        uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Attach installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          upload_one() {
            local file="$1"
            local required="${2:-1}"
            local n=1
            local max=8
            while true; do
              echo "Uploading $(basename "$file") (attempt ${n}/${max}, $(du -h "$file" | cut -f1))"
              if gh release upload "$TAG" "$file" --clobber; then
                echo "OK $(basename "$file")"
                return 0
              fi
              if [ "$n" -ge "$max" ]; then
                if [ "$required" = "1" ]; then
                  echo "::error::Failed to upload $file after ${max} attempts"
                  return 1
                fi
                echo "::warning::Optional asset failed: $file"
                return 0
              fi
              n=$((n + 1))
              sleep $((n * 15))
            done
          }
          mapfile -t nsis < <(find artifacts -type f -name '*-setup.exe' | sort)
          mapfile -t json < <(find artifacts -type f -name 'latest.json' | sort)
          mapfile -t msi < <(find artifacts -type f -name '*.msi' | sort)
          if [ ${#nsis[@]} -eq 0 ] || [ ${#json[@]} -eq 0 ]; then
            echo "::error::windows-bundle is missing NSIS installer or latest.json"
            find artifacts -type f -print
            exit 1
          fi
          for f in "${nsis[@]}"; do upload_one "$f" 1; done
          for f in "${json[@]}"; do upload_one "$f" 1; done
          for f in "${msi[@]}"; do upload_one "$f" 0; done
