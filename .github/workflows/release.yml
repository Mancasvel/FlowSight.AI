name: Release — FlowSight Agent

on:
  release:
    types: [published]
  # Re-attach installers without republishing. Use artifact_run_id to skip the
  # ~30min Windows rebuild when the bundle already exists from a prior run.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach Windows installers to (e.g. v3.6.1)"
        required: true
        type: string
      artifact_run_id:
        description: "Optional Actions run ID that already has the windows-bundle artifact"
        required: false
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

# Secrets requeridos en el repo: Settings → Secrets and variables → Actions
#   TAURI_JIRA_CLIENT_ID, TAURI_JIRA_CLIENT_SECRET
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLIC_KEY
#   (NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY are also accepted.)
# (Opcional: TAURI_LINEAR_CLIENT_ID, TAURI_LINEAR_CLIENT_SECRET si usáis Linear.)
# No commitees .env.local; el CI inyecta estos valores en `pnpm build`.

# Note: Linux builds live in a separate repo (Mancasvel/FlowSight_linux).
# Cliente iOS: repositorio dedicado FlowSight-iOS (fuera de este monorepo).
# Este workflow solo produce instaladores Windows.

jobs:
  build-windows:
    if: ${{ (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) && (github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == '') }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAURI_JIRA_CLIENT_ID: ${{ secrets.TAURI_JIRA_CLIENT_ID }}
      TAURI_JIRA_CLIENT_SECRET: ${{ secrets.TAURI_JIRA_CLIENT_SECRET }}
      TAURI_LINEAR_CLIENT_ID: ${{ secrets.TAURI_LINEAR_CLIENT_ID }}
      TAURI_LINEAR_CLIENT_SECRET: ${{ secrets.TAURI_LINEAR_CLIENT_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLIC_KEY }}
      # Required for signed auto-update artifacts (tauri-plugin-updater).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - name: Reject outdated tauri 2.9.x (stale release tag)
        shell: bash
        run: |
          set -euo pipefail
          f=apps/agent/src-tauri/Cargo.toml
          if grep -qE 'tauri = \{ version = "2\.9' "$f"; then
            echo "::error title=Stale release tag::Create a **new tag** on the latest \`main\` and publish a **new** GitHub Release."
            grep -E 'tauri' "$f" || true
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/agent/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches application version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const tag = process.env.RELEASE_TAG;
          const expected = tag.replace(/^v/, '');
          const versions = {
            'package.json': JSON.parse(fs.readFileSync('package.json', 'utf8')).version,
            'apps/agent/package.json': JSON.parse(fs.readFileSync('apps/agent/package.json', 'utf8')).version,
            'apps/agent/src-tauri/tauri.conf.json': JSON.parse(fs.readFileSync('apps/agent/src-tauri/tauri.conf.json', 'utf8')).version,
          };
          const cargo = fs.readFileSync('apps/agent/src-tauri/Cargo.toml', 'utf8');
          versions['apps/agent/src-tauri/Cargo.toml'] = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const mismatches = Object.entries(versions).filter(([, version]) => version !== expected);
          if (mismatches.length) {
            console.error(`Release ${tag} does not match application versions:`, versions);
            process.exit(1);
          }
          console.log(`Release ${tag} matches every application manifest.`);
          NODE

      # Tauri's build script validates configured bundle resources even during
      # `cargo test`, so model assets must exist before the Rust test gate.
      - name: Fetch local model assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @flowsight/agent fetch-models

      - name: Smoke test bundled Qwen3.5 multimodal runtime
        run: node scripts/check-local-vision.mjs

      - name: Renderer tests
        run: pnpm --filter @flowsight/agent test:renderer

      - name: Local review queue privacy tests
        run: python -m unittest discover -s tools/finetune -p 'test_*.py'

      - name: Rust tests
        run: cargo test --manifest-path apps/agent/src-tauri/Cargo.toml --lib

      - name: Rust formatting
        run: cargo fmt --manifest-path apps/agent/src-tauri/Cargo.toml --all -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path apps/agent/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Supabase function tests
        run: deno test --node-modules-dir=none --allow-env --allow-read supabase/functions

      - name: JavaScript dependency audit
        run: pnpm audit

      - name: Build app
        run: pnpm build

      - name: Smoke test MCP in the packaged executable
        run: node scripts/check-mcp-stdio.mjs apps/agent/src-tauri/target/release/app.exe

      # Generate the updater manifest the app polls at
      # releases/latest/download/latest.json. We point it at the NSIS installer
      # because it self-updates per-user without a UAC prompt. GitHub renames
      # release assets by replacing spaces with dots, so the download URL must too.
      - name: Generate latest.json (updater manifest)
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_BODY: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NSIS_DIR="apps/agent/src-tauri/target/release/bundle/nsis"
          EXE="$(ls "$NSIS_DIR"/*-setup.exe | head -n1)"
          SIG="$(ls "$NSIS_DIR"/*-setup.exe.sig | head -n1)"
          BASENAME="$(basename "$EXE")"
          # GitHub stores release assets with spaces replaced by dots.
          export ASSET_NAME="$(echo "$BASENAME" | tr ' ' '.')"
          export APP_VERSION="$(echo "$BASENAME" | sed -E 's/.*_([0-9]+\.[0-9]+\.[0-9]+)_.*/\1/')"
          export DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
          export SIGNATURE="$(cat "$SIG")"
          export PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node -e '
            const fs = require("fs");
            const manifest = {
              version: process.env.APP_VERSION,
              notes: process.env.RELEASE_BODY || "",
              pub_date: process.env.PUB_DATE,
              platforms: {
                "windows-x86_64": {
                  signature: process.env.SIGNATURE,
                  url: process.env.DOWNLOAD_URL
                }
              }
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
            console.log(manifest);
          '

      - name: Upload Windows bundles
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            apps/agent/src-tauri/target/release/bundle/nsis/*.exe
            apps/agent/src-tauri/target/release/bundle/msi/*.msi
            latest.json
          if-no-files-found: error
          retention-days: 14

      # Upload from the Windows runner so we do not round-trip ~3GB through
      # artifacts just to attach. gh CLI handles >1GB files better than
      # softprops/action-gh-release, and retries cover GitHub upload 5xx.
      # --repo is required: gh otherwise needs a git checkout to infer the repo
      # (attach-from-artifact has no checkout; Windows uploads have also failed
      # mid-file with GitHub 5xx, leaving latest.json pointing at a 404).
      - name: Attach installers to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          upload_one() {
            local file="$1"
            local required="${2:-1}"
            local n=1
            local max=8
            while true; do
              echo "Uploading $(basename "$file") (attempt ${n}/${max}, $(du -h "$file" | cut -f1))"
              if gh release upload "$TAG" "$file" --clobber --repo "$REPO"; then
                echo "OK $(basename "$file")"
                return 0
              fi
              if [ "$n" -ge "$max" ]; then
                if [ "$required" = "1" ]; then
                  echo "::error::Failed to upload $file after ${max} attempts"
                  return 1
                fi
                echo "::warning::Optional asset failed: $file"
                return 0
              fi
              n=$((n + 1))
              sleep $((n * 15))
            done
          }
          shopt -s nullglob
          nsis=(apps/agent/src-tauri/target/release/bundle/nsis/*-setup.exe)
          msi=(apps/agent/src-tauri/target/release/bundle/msi/*.msi)
          if [ ${#nsis[@]} -eq 0 ]; then
            echo "::error::No NSIS *-setup.exe found"
            exit 1
          fi
          for f in "${nsis[@]}"; do upload_one "$f" 1; done
          upload_one latest.json 1
          for f in "${msi[@]}"; do upload_one "$f" 0; done

      - name: Verify updater asset is reachable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" == "true" ]]; then
            echo "Release is still a draft; public updater URL will be checked after publication."
            exit 0
          fi
          url="$(node -pe "JSON.parse(require('fs').readFileSync('latest.json','utf8')).platforms['windows-x86_64'].url")"
          echo "Checking updater URL: $url"
          n=1
          max=12
          while [ "$n" -le "$max" ]; do
            # Range request: confirm HTTP 200/206 without downloading the ~1.5GB installer.
            code="$(curl -sL -o /dev/null -w '%{http_code}' -r 0-0 "$url")"
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then
              echo "Updater asset OK (HTTP $code)"
              exit 0
            fi
            echo "Attempt ${n}/${max}: HTTP $code — waiting for GitHub CDN…"
            n=$((n + 1))
            sleep 15
          done
          echo "::error::Updater installer not reachable at $url (last HTTP $code). Auto-update will fail until the NSIS *-setup.exe is on release ${TAG}."
          exit 1

  attach-from-artifact:
    # Retry path: reuse a successful windows-bundle instead of rebuilding.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download windows-bundle from prior run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          n=1
          max=8
          while true; do
            echo "Download attempt ${n}/${max} from run ${RUN_ID}"
            if gh run download "$RUN_ID" -n windows-bundle -D artifacts --repo "${{ github.repository }}"; then
              echo "Downloaded windows-bundle"
              find artifacts -type f -printf '%p %s\n'
              exit 0
            fi
            if [ "$n" -ge "$max" ]; then
              echo "::error::Failed to download windows-bundle from run ${RUN_ID} after ${max} attempts"
              exit 1
            fi
            n=$((n + 1))
            sleep $((n * 20))
          done

      - name: Attach installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          upload_one() {
            local file="$1"
            local required="${2:-1}"
            local n=1
            local max=8
            while true; do
              echo "Uploading $(basename "$file") (attempt ${n}/${max}, $(du -h "$file" | cut -f1))"
              if gh release upload "$TAG" "$file" --clobber --repo "$REPO"; then
                echo "OK $(basename "$file")"
                return 0
              fi
              if [ "$n" -ge "$max" ]; then
                if [ "$required" = "1" ]; then
                  echo "::error::Failed to upload $file after ${max} attempts"
                  return 1
                fi
                echo "::warning::Optional asset failed: $file"
                return 0
              fi
              n=$((n + 1))
              sleep $((n * 15))
            done
          }
          mapfile -t nsis < <(find artifacts -type f -name '*-setup.exe' | sort)
          mapfile -t json < <(find artifacts -type f -name 'latest.json' | sort)
          mapfile -t msi < <(find artifacts -type f -name '*.msi' | sort)
          if [ ${#nsis[@]} -eq 0 ] || [ ${#json[@]} -eq 0 ]; then
            echo "::error::windows-bundle is missing NSIS installer or latest.json"
            find artifacts -type f -print
            exit 1
          fi
          for f in "${nsis[@]}"; do upload_one "$f" 1; done
          for f in "${json[@]}"; do upload_one "$f" 1; done
          for f in "${msi[@]}"; do upload_one "$f" 0; done

      - name: Verify updater asset is reachable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" == "true" ]]; then
            echo "Release is still a draft; public updater URL will be checked after publication."
            exit 0
          fi
          json="$(find artifacts -type f -name 'latest.json' | head -n1)"
          url="$(node -pe "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).platforms['windows-x86_64'].url" "$json")"
          echo "Checking updater URL: $url"
          n=1
          max=12
          while [ "$n" -le "$max" ]; do
            # Range request: confirm HTTP 200/206 without downloading the ~1.5GB installer.
            code="$(curl -sL -o /dev/null -w '%{http_code}' -r 0-0 "$url")"
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then
              echo "Updater asset OK (HTTP $code)"
              exit 0
            fi
            echo "Attempt ${n}/${max}: HTTP $code — waiting for GitHub CDN…"
            n=$((n + 1))
            sleep 15
          done
          echo "::error::Updater installer not reachable at $url (last HTTP $code). Auto-update will fail until the NSIS *-setup.exe is on release ${TAG}."
          exit 1
