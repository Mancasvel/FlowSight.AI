name: Agent PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime-staging:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stage signed Microsoft Visual C++ runtime
        shell: pwsh
        run: ./scripts/stage-msvc-runtime.ps1

      - name: Repeat staging through Tauri's cmd.exe and Windows PowerShell 5.1 hosts
        shell: pwsh
        working-directory: apps/agent
        run: |
          & cmd.exe /d /s /c "powershell.exe -NoProfile -File ../../scripts/stage-msvc-runtime.ps1"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell staging failed with exit code $LASTEXITCODE"
          }

      - name: Verify staging without the Get-FileHash function
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -File ./scripts/check-runtime-staging.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Hash regression failed with exit code $LASTEXITCODE"
          }

      - name: Verify both executable runtime directories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resources = (Get-Content apps/agent/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).bundle.resources
          if ($resources.'../../../local_llm/bin/*.dll' -ne 'local_llm/bin/') {
            throw 'Tauri no longer places DLLs beside llama-server.exe.'
          }
          if (-not (Test-Path -LiteralPath 'local_llm/bin/llama-server.exe' -PathType Leaf)) {
            throw 'llama-server.exe is missing from the checkout.'
          }
          foreach ($name in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if ($resources."../../../local_llm/app_runtime/$name" -ne $name) {
              throw "Tauri no longer places $name beside app.exe."
            }
            $appCopy = Join-Path 'local_llm/app_runtime' $name
            $sidecarCopy = Join-Path 'local_llm/bin' $name
            foreach ($path in @($appCopy, $sidecarCopy)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Staged runtime file missing: $path"
              }
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
                throw "Staged runtime file is not signed by Microsoft: $path"
              }
            }
            if ((Get-FileHash -LiteralPath $appCopy -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $sidecarCopy -Algorithm SHA256).Hash) {
              throw "Runtime copies differ: $name"
            }
            Write-Host "Verified signed $name beside app.exe and llama-server.exe."
          }

  renderer-and-format:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Renderer and browser extension tests
        run: pnpm --filter @flowsight/agent test:renderer

      - name: Build renderer
        run: pnpm --filter @flowsight/agent exec vite build

      - name: Rust formatting
        run: cargo fmt --manifest-path apps/agent/src-tauri/Cargo.toml --all -- --check

      - name: Install browser for actual renderer checks
        run: pnpm exec playwright install chromium

      - name: Check setup, planner, localization, Notion availability, and dark button states
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'flowsight-renderer.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'flowsight-renderer.stderr.log'
          $env:FLOWSIGHT_RENDERER_URL = 'http://127.0.0.1:1420'
          $server = Start-Process -FilePath 'cmd.exe' -ArgumentList '/d', '/s', '/c', 'corepack pnpm --filter @flowsight/agent exec vite preview --host 127.0.0.1 --port 1420 --strictPort' -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:1420/' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Renderer did not become available.' }
            node scripts/verify-session-onboarding.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Setup and planner renderer checks failed.' }
            node scripts/verify-total-focus-extension.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Actual browser extension focus checks failed.' }
            node scripts/verify-dark-button-hovers.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Dark hover renderer checks failed.' }
            node scripts/verify-adda-renderer.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Measured ADDA proposal renderer replay failed.' }
            node scripts/verify-localization.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Production localization and state preservation checks failed.' }
            node scripts/verify-coach-conversation.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Saved Pro Coach conversation and reply checks failed.' }
            node scripts/verify-linked-session.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Linked calendar session recovery and destination checks failed.' }
          } finally {
            if (-not $server.HasExited) { & taskkill.exe /PID $server.Id /T /F | Out-Null }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-and-ui-renderer-evidence
          path: .impeccable/review/

  rust-host:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/agent/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage the signed native runtime
        shell: pwsh
        run: ./scripts/stage-msvc-runtime.ps1

      - name: Build renderer resources
        run: pnpm --filter @flowsight/agent exec vite build

      - name: Host unit tests
        run: cargo test --manifest-path apps/agent/src-tauri/Cargo.toml --lib

      - name: Host lint
        run: cargo clippy --manifest-path apps/agent/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
