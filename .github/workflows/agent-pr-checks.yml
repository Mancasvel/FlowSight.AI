name: Agent PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-and-format:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Renderer and browser extension tests
        run: pnpm --filter @flowsight/agent test:renderer

      - name: Build renderer
        run: pnpm --filter @flowsight/agent exec vite build

      - name: Rust formatting
        run: cargo fmt --manifest-path apps/agent/src-tauri/Cargo.toml --all -- --check
